pipeline:
  name: python-harness-ci-demo
  identifier: python_harness_ci_demo
  projectIdentifier: HarnessCICDZerotoHero
  orgIdentifier: default
  tags: {}

  properties:
    ci:
      codebase:
        connectorRef: github
        repoName: python-harness-ci-demo
        build:
          type: branch
          spec:
            branch: main

  stages:
    - stage:
        name: Python Build and Docker Push
        identifier: python_build_docker_push
        description: Build, test and push Python app to Docker Hub
        type: CI
        spec:
          cloneCodebase: true
          platform:
            os: Linux
            arch: Amd64
          runtime:
            type: Cloud
            spec: {}

          execution:
            steps:

              # STEP 1: Install Dependencies
              - step:
                  type: Run
                  name: Install Python Dependencies
                  identifier: install_python_dependencies
                  spec:
                    shell: Sh
                    command: |-
                      set -e

                      echo "=== Checking Python Version ==="
                      python3 --version

                      echo "=== Checking Project Files ==="
                      pwd
                      ls -la

                      echo "=== Creating Virtual Environment ==="
                      python3 -m venv /tmp/python-ci-venv

                      echo "=== Installing Dependencies ==="
                      /tmp/python-ci-venv/bin/python -m pip install --upgrade pip
                      /tmp/python-ci-venv/bin/python -m pip install -r requirements.txt
                      /tmp/python-ci-venv/bin/python -m pip install pytest

                      echo "=== Dependencies Installed Successfully ==="

              # STEP 2: Run Python Unit Tests
              - step:
                  type: Run
                  name: Run Python Unit Tests
                  identifier: run_python_tests
                  spec:
                    shell: Sh
                    command: |-
                      set -e

                      echo "=== Running Python Unit Tests ==="
                      /tmp/python-ci-venv/bin/python -m pytest test_app.py -v

                      echo "=== All Unit Tests Passed ==="

              # STEP 3: Verify Python Application
              - step:
                  type: Run
                  name: Verify Python Application
                  identifier: verify_python_app
                  spec:
                    shell: Sh
                    command: |-
                      set -e

                      echo "=== Verifying Flask App ==="
                      /tmp/python-ci-venv/bin/python -c "from app import app; c = app.test_client(); assert c.get('/').status_code == 200; assert c.get('/health').status_code == 200; print('Flask endpoints verified')"

                      echo "=== Application Verification Passed ==="

              # STEP 4: Build and Push to Docker Hub
              - step:
                  type: BuildAndPushDockerRegistry
                  name: Build and Push Docker Image
                  identifier: build_push_docker
                  spec:
                    connectorRef: dockerhub
                    repo: hk48/python-harness-ci-demo
                    tags:
                      - <+pipeline.sequenceId>
                      - latest
                    dockerfile: Dockerfile
                    context: .

              # STEP 5: Display Image Details
              - step:
                  type: Run
                  name: Display Docker Image Details
                  identifier: display_docker_image
                  spec:
                    shell: Sh
                    command: |-
                      echo "======================================"
                      echo "DOCKER BUILD AND PUSH COMPLETED"
                      echo "======================================"
                      echo "Repository: hk48/python-harness-ci-demo"
                      echo "Tag: <+pipeline.sequenceId>"
                      echo "Tag: latest"
                      echo "Docker Hub: https://hub.docker.com/r/hk48/python-harness-ci-demo"
                      echo "======================================"
