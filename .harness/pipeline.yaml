pipeline:
  name: python-harness-ci-demo
  identifier: python_harness_ci_demo
  projectIdentifier: HarnessCICDZerotoHero
  orgIdentifier: default
  tags: {}

  properties:
    ci:
      codebase:
        connectorRef: github
        repoName: python-harness-ci-demo
        build:
          type: branch
          spec:
            branch: main

  stages:
    - stage:
        name: Python Build and Docker Push
        identifier: python_build_docker_push
        description: Test Python app and push to Docker Hub
        type: CI
        spec:
          cloneCodebase: true

          platform:
            os: Linux
            arch: Amd64

          runtime:
            type: Cloud
            spec: {}

          execution:
            steps:
              # STEP 1: Install, Test and Verify
              - step:
                  type: Run
                  name: Test Python Application
                  identifier: test_python_application
                  spec:
                    shell: Sh
                    command: |-
                      set -eu

                      echo "=== Python Version ==="
                      python3 --version

                      echo "=== Project Files ==="
                      pwd
                      ls -la

                      echo "=== Verify Required Files ==="
                      test -f app.py
                      test -f requirements.txt
                      test -f test_app.py
                      test -f Dockerfile

                      echo "=== Create Python Virtual Environment ==="
                      python3 -m venv /tmp/python-ci-venv

                      echo "=== Install Dependencies ==="
                      /tmp/python-ci-venv/bin/python -m pip install -r requirements.txt
                      /tmp/python-ci-venv/bin/python -m pip install pytest

                      echo "=== Run Python Tests ==="
                      /tmp/python-ci-venv/bin/python -m pytest test_app.py -v

                      echo "=== Verify Flask Application ==="
                      /tmp/python-ci-venv/bin/python -c "from app import app; c=app.test_client(); assert c.get('/').status_code == 200; assert c.get('/health').status_code == 200; print('Application verified')"

                      echo "=== Python Tests and Verification Passed ==="

              # STEP 2: Build and Push Docker Image
              - step:
                  type: BuildAndPushDockerRegistry
                  name: Build and Push Docker Image
                  identifier: build_push_docker
                  spec:
                    connectorRef: dockerhub
                    repo: hk48/python-harness-ci-demo
                    tags:
                      - <+pipeline.sequenceId>
                      - latest
                    dockerfile: Dockerfile
                    context: .

              # STEP 3: Display Image Details
              - step:
                  type: Run
                  name: Display Image Details
                  identifier: display_image
                  spec:
                    shell: Sh
                    command: |-
                      echo "=== Docker Push Step Succeeded ==="
                      echo "Repository: hk48/python-harness-ci-demo"
                      echo "Build Tag: <+pipeline.sequenceId>"
                      echo "Latest Tag: latest"
                      echo "=== Pipeline Completed ==="
